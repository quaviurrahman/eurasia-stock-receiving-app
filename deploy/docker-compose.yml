name: eurasia

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ./local.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      LOCAL_STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - cpis

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:

networks:
  cpis:
    name: ${CPIS_NETWORK:-cpis_shared}
    external: true
